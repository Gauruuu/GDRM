  <script>
    const md = "# GDRM Ecosystem \u2014 Complete Technical Specification & Architectural Documentation\n\n**Project Name:** GDRM Document Protection Ecosystem  \n**Author:** Gauraang Dalal  \n**Core Framework:** Flutter (Dart) & Native OS Platform Integration  \n**Backend & Database:** Firebase Authentication, Cloud Firestore & Gmail SMTP  \n**Supported Platforms:** Windows (x86_64), Android, macOS, Linux, iOS  \n**Document Classification:** Comprehensive System Architecture, Protocols, Cryptographic Formalisms & Mathematical Formulas  \n\n---\n\n## 1. Executive Summary & Architectural Overview\n\nThe **GDRM (Gaur DRM) Ecosystem** is an autonomous, cross-platform Digital Rights Management and document security architecture designed to prevent unauthorized distribution, piracy, dynamic memory extraction, screen scraping, and illicit printing of confidential PDF documents.\n\nUnlike traditional cloud DRM systems that enforce heavy server-dependent viewer locks or proprietary browser plugins, GDRM encapsulates PDF payloads into tamper-evident, self-contained binary envelopes (`.gdrm` files). The container operates autonomously through an embedded cryptographic header, machine-bound hardware locks, dynamic steganographic watermarking, time-based cryptographic gating (ChronoLock), self-destructing brute-force barriers (FileRip), and cloud-synchronized audit trails (SnailTrail).\n\n```\n+---------------------------------------------------------------------------------------------------+\n|                                      GDRM ECOSYSTEM ARCHITECTURE                                  |\n+---------------------------------------------------------------------------------------------------+\n|                                                                                                   |\n|    +------------------------+      Pack Container       +------------------------------------+   |\n|    |      PACKER ENGINE     | -----------------------> |         .gdrm FILE CONTAINER        |   |\n|    | (Author / Spool Admin) |                          |  - Cryptographic Manifest Header    |   |\n|    +------------------------+                          |  - SnailTrail Audit Chain           |   |\n|                 |                                      |  - 512-Byte Derived XOR Ciphertext  |   |\n|                 |                                      +------------------------------------+   |\n|                 | Real-time Alerts                                        |                       |\n|                 v                                                         v Hardware / Key Check  |\n|    +------------------------+      Real-time Streams    +------------------------------------+   |\n|    |    FIREBASE CLOUD      | <----------------------- |          READER ENGINE             |   |\n|    | - Auth Identity Engine |   Piracy Events, Audit   |  - Hardware Machine Binding Check   |   |\n|    | - Cloud Firestore      |   Trails, User Registry  |  - ChronoLock & TimeBomb Timers     |   |\n|    | - Gmail SMTP OTP Spool |                          |  - FileRip Self-Destruct Protection |   |\n|    +------------------------+                          |  - Dynamic Steganographic Canvas    |   |\n|                                                        |  - Secure Hardware Print Spooler    |   |\n|                                                        +------------------------------------+   |\n|                                                                                                   |\n+---------------------------------------------------------------------------------------------------+\n```\n\n---\n\n## 2. Mathematical Formalisms & Cryptographic Formulas\n\nThis section specifies all cryptographic algorithms, key derivation functions (KDF), pseudo-random generators, and mathematical transforms implemented across the GDRM Ecosystem.\n\n### 2.1. Cryptographic Hash Primitives\nLet $\\mathcal{H}(M)$ denote the standard SHA-256 cryptographic hash function outputting a 256-bit (32-byte) digest:\n$$\\mathcal{H}(M) = \\operatorname{SHA-256}(M) \\in \\{0, 1\\}^{256}$$\n\nLet $\\operatorname{Hex}(B)$ denote the lowercase hexadecimal encoding function mapping a byte array $B \\in \\{0, \\dots, 255\\}^k$ to a string of length $2k$.\n\n---\n\n### 2.2. Machine Identity & Hardware Key Derivation\nEvery host device running the GDRM client is assigned a persistent, cryptographically generated UUID $U \\in \\{0, 1\\}^{128}$ conforming to RFC 4122 Version 4 (pseudo-random UUID).\n\nThe Machine Hardware Device Key $K_{\\text{device}}$ is derived by hashing the hardware UUID salted with the namespace constant `GDRM_DEVICE_SALT_v1:` and truncating the hexadecimal digest to the first 48 characters (192 bits of entropy):\n\n$$K_{\\text{device}} = \\operatorname{Hex}\\Big(\\mathcal{H}\\big(\\text{\"GDRM\\_DEVICE\\_SALT\\_v1:\"} \\parallel U\\big)\\Big)\\big[0:48\\big]$$\n\n$$\\text{Domain}(K_{\\text{device}}) \\in [0-9a-f]^{48}$$\n\n---\n\n### 2.3. FileRip Password Derivation & Salt Hashing\nWhen password protection is enabled by the author, the plaintext password $P_{\\text{plain}}$ is salted and hashed into a 64-character SHA-256 hex string $H_{\\text{pwd}}$:\n\n$$H_{\\text{pwd}} = \\operatorname{Hex}\\Big(\\mathcal{H}\\big(\\text{\"GDRM\\_PASSWORD\\_SALT\\_v1:\"} \\parallel P_{\\text{plain}}\\big)\\Big)$$\n\nThe client verifies an entered attempt $P_{\\text{try}}$ by evaluating:\n$$\\operatorname{VerifyPass}(P_{\\text{try}}) = \\begin{cases} \n\\text{True}, & \\text{if } \\operatorname{Hex}\\Big(\\mathcal{H}\\big(\\text{\"GDRM\\_PASSWORD\\_SALT\\_v1:\"} \\parallel P_{\\text{try}}\\big)\\Big) = H_{\\text{pwd}} \\\\ \n\\text{False}, & \\text{otherwise} \n\\end{cases}$$\n\n---\n\n### 2.4. Document Encryption: 512-Byte Keystream Derivation Pipeline\nThe document payload is encrypted using a cyclical pseudo-random keystream generated through continuous SHA-256 hash chaining seeded with an author-generated 128-bit random sender token $T_{\\text{sender}}$.\n\n#### 1. Sender Token Generation:\n$$T_{\\text{sender}} = \\operatorname{Hex}\\big(R\\big), \\quad R \\xleftarrow{\\$} \\{0, \\dots, 255\\}^{16}$$\n\n#### 2. Hash Chain Expansion:\nTo create a high-diffusion 512-byte ($4096$-bit) keystream $K_{\\text{xor}}$, the system computes a sequence of SHA-256 blocks $\\{C_0, C_1, \\dots, C_{15}\\}$ such that:\n\n$$C_0 = \\mathcal{H}\\big(\\text{\"GDRM\\_PDF\\_ENCRYPT\\_v1:\"} \\parallel T_{\\text{sender}}\\big) \\in \\{0, \\dots, 255\\}^{32}$$\n$$C_{k} = \\mathcal{H}(C_{k-1}) \\in \\{0, \\dots, 255\\}^{32}, \\quad \\text{for } k = 1, 2, \\dots, 15$$\n\n#### 3. Keystream Assembly:\nThe complete keystream $K_{\\text{xor}}$ is formed by concatenating the 16 consecutive 32-byte digest blocks:\n$$K_{\\text{xor}} = C_0 \\parallel C_1 \\parallel C_2 \\parallel \\dots \\parallel C_{15} \\in \\{0, \\dots, 255\\}^{512}$$\n\n$$\\operatorname{Length}(K_{\\text{xor}}) = 16 \\times 32 = 512 \\text{ bytes}$$\n\n---\n\n### 2.5. Symmetric XOR Cipher Stream Transformation\nGiven a plaintext PDF document consisting of an ordered byte array $\\mathbf{P} = [P_0, P_1, \\dots, P_{N-1}]$ where $P_i \\in \\{0, \\dots, 255\\}$ and $N \\in \\mathbb{N}$:\n\n#### 1. Encryption Transformation:\n$$\\mathbf{E} = [E_0, E_1, \\dots, E_{N-1}]$$\n$$E_i = P_i \\oplus K_{\\text{xor}}[i \\bmod 512], \\quad \\forall i \\in \\{0, 1, \\dots, N-1\\}$$\n\nwhere $\\oplus$ represents the bitwise exclusive-OR (XOR) operator.\n\n#### 2. Decryption Inversion:\nDue to the self-inverting algebraic property of the XOR group $(\\mathbb{Z}_2^8, \\oplus)$:\n$$P_i = E_i \\oplus K_{\\text{xor}}[i \\bmod 512] = (P_i \\oplus K_{\\text{xor}}[i \\bmod 512]) \\oplus K_{\\text{xor}}[i \\bmod 512] = P_i$$\n\n---\n\n### 2.6. Mathematical Representation of Access Control Gates\n\nLet $t \\in \\mathbb{R}^+$ represent current UTC epoch time in seconds.\n\n#### 1. ChronoLock Gating:\n$$\\text{IsTimeLocked}(t, t_{\\text{openAt}}) = \\begin{cases} \n\\text{True (Locked)}, & \\text{if } t < t_{\\text{openAt}} \\\\ \n\\text{False (Unlocked)}, & \\text{if } t \\ge t_{\\text{openAt}} \n\\end{cases}$$\n\n#### 2. RiggedFile TimeBomb Lifespan:\n$$\\text{IsTimeBombed}(t, t_{\\text{expiry}}) = \\begin{cases} \n\\text{True (Trigger Destruction)}, & \\text{if } t > t_{\\text{expiry}} \\\\ \n\\text{False (Valid)}, & \\text{if } t \\le t_{\\text{expiry}} \n\\end{cases}$$\n\n#### 3. RiggedFile View-Count Ceiling:\n$$\\text{IsOpenCeilingExceeded}(C_{\\text{curr}}, C_{\\text{max}}) = \\begin{cases} \n\\text{True (Trigger Destruction)}, & \\text{if } C_{\\text{max}} > 0 \\text{ and } C_{\\text{curr}} \\ge C_{\\text{max}} \\\\ \n\\text{False (Permitted)}, & \\text{otherwise} \n\\end{cases}$$\n\n#### 4. Hardware Machine Binding DRM State:\nLet $R \\in \\{\\emptyset\\} \\cup [0-9a-f]^{48}$ represent the `RECEIVER` header field, and $K_{\\text{local}}$ be the opening host's hardware key:\n\n$$\\operatorname{EvaluateDRM}(R, K_{\\text{local}}) = \\begin{cases} \n\\text{BoundNow (First Activation)}, & \\text{if } R = \\emptyset \\\\ \n\\text{Authorised (Owner Match)}, & \\text{if } R = K_{\\text{local}} \\\\ \n\\text{PiracyDetected (Breach Alert)}, & \\text{if } R \\neq \\emptyset \\text{ and } R \\neq K_{\\text{local}} \n\\end{cases}$$\n\n---\n\n### 2.7. Forensic Canvas Matrix & Point Scaling Transform\nWhen rendering dynamic watermarks and converting raster pages for physical paper printing:\n\n#### 1. Resolution DPI to PDF Points Transform:\nStandard typographic PDF space utilizes $72$ PostScript points per inch. Given page pixel dimensions $(W_{\\text{px}}, H_{\\text{px}})$ rasterized at resolution $D_{\\text{dpi}}$:\n\n$$W_{\\text{pt}} = W_{\\text{px}} \\times \\left(\\frac{72}{D_{\\text{dpi}}}\\right)$$\n$$H_{\\text{pt}} = H_{\\text{px}} \\times \\left(\\frac{72}{D_{\\text{dpi}}}\\right)$$\n\n#### 2. Dynamic 2D Watermark Tiling Matrix:\nLet $(x, y)$ be the untransformed canvas coordinate and $\\theta$ be the rotational angle ($\\theta = -0.45\\text{ rad} \\approx -25.78^\\circ$ on screen, $\\theta = -0.58\\text{ rad} \\approx -33.23^\\circ$ on print).\n\nThe affine rotation matrix $\\mathbf{R}(\\theta)$ applied to each watermark vertex is:\n$$\\begin{bmatrix} x' \\\\ y' \\end{bmatrix} = \\begin{bmatrix} \\cos \\theta & -\\sin \\theta \\\\ \\sin \\theta & \\cos \\theta \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\end{bmatrix}$$\n\nWatermark tiles are distributed over the periodic grid:\n$$\\mathcal{G} = \\big\\{(x_0 + m \\cdot \\Delta X, \\, y_0 + n \\cdot \\Delta Y) \\;\\big|\\; m, n \\in \\mathbb{Z}, -W \\le x \\le 2W, -H \\le y \\le 2H\\big\\}$$\nwhere grid strides are $\\Delta X = 280\\text{ pt}$ and $\\Delta Y = 300\\text{ pt}$.\n\n---\n\n## 3. Container File Format Specification (`.gdrm`)\n\nA `.gdrm` file is a structured binary container consisting of three contiguous segments:\n1. **Plaintext Metadata Header (UTF-8 ASCII Key-Value Pairs)**\n2. **Encapsulated SnailTrail Audit Chain Block**\n3. **Delimiter Marker & Ciphertext Binary Payload**\n\n```\n+-------------------------------------------------------------------------+\n| GDRM_V1\\n                                                               |\n| LICENSED_TO=<Licensee Name>\\n                                           |\n| COPYRIGHT_OWNER=<Author Name or Organization>\\n                         |\n| FINGERPRINT=GDRM-XXXX-XXXX-XXXX\\n                                       |\n| MEME_SIGNATURE=<Cryptographic Stamp / Meme Sig>\\n                       |\n| TIMESTAMP=<Epoch Time in Seconds with 6 Decimal Precision>\\n            |\n| SENDER=<32-Hex-Char Sender Token>\\n                                     |\n| SENDER_USERNAME=<Firebase Author Username Handle>\\n                     |\n| SENDER_EMAIL=<Author Email Address>\\n                                   |\n| SENDER_NAME=<Author Display Name>\\n                                     |\n| SENDER_DEVICE_KEY=<Origin Author Hardware Key Hash>\\n                   |\n| RECEIVER=<48-Hex-Char Bound Hardware Key Hash>\\n                        |\n| OPEN_AT=<ISO-8601 ChronoLock UTC Timestamp>\\n                           |\n| PASSWORD_HASH=<SHA-256 Salted Password Hash>\\n                          |\n| MAX_ATTEMPTS=<Integer Maximum Allowed Failed Passwords>\\n               |\n| CURRENT_ATTEMPTS=<Integer Current Failed Password Counter>\\n            |\n| TARGET_USERNAME=<Authorized Recipient Username Handle>\\n                |\n| RIGGED_EXPIRY=<ISO-8601 Lifespan Expiration UTC Timestamp>\\n            |\n| MAX_OPENS=<Integer Maximum Allowed View Count>\\n                        |\n| CURRENT_OPENS=<Integer Current View Counter>\\n                          |\n| ALLOW_PRINT=<1 or 0 Hardware Printing Permission>\\n                     |\n| MEMBERS_ONLY=<1 or 0 GDRM Ecosystem Member Enforcement>\\n               |\n| TRAIL_START\\n                                                           |\n| <ACTION>|<TIMESTAMP>|<DEVICE_KEY>|<DETAILS>\\n                           |\n| ...                                                                     |\n| TRAIL_END\\n                                                             |\n| ===PDFDATA===\\n                                                         |\n| [Binary Encrypted Payload: N Bytes of XOR-Transformed PDF Stream]       |\n+-------------------------------------------------------------------------+\n```\n\n### Header Field Dictionary\n\n| Key | Format | Description |\n|---|---|---|\n| `GDRM_V1` | Static Magic Header | Identifies valid GDRM container version 1. |\n| `LICENSED_TO` | UTF-8 String | Designated licensee, student, or client identity. |\n| `COPYRIGHT_OWNER` | UTF-8 String | Author, publisher, or issuing institution. |\n| `FINGERPRINT` | `GDRM-XXXX-XXXX-XXXX` | 16-character pseudo-random cryptographic tracking hash. |\n| `MEME_SIGNATURE` | UTF-8 String | Watermark stamp identifier or custom meme tag. |\n| `TIMESTAMP` | Float String | Container creation UTC epoch timestamp (`%.6f`). |\n| `SENDER` | 32-Char Hex String | 128-bit random seed token used to derive keystream $K_{\\text{xor}}$. |\n| `SENDER_USERNAME` | Lowercase Alphanumeric | Author's unique GDRM handle (e.g., `gauraang`). |\n| `SENDER_EMAIL` | Email Address | Author's verified communication address. |\n| `SENDER_NAME` | UTF-8 String | Author's human-readable display name. |\n| `SENDER_DEVICE_KEY` | 48-Char Hex String | Originating machine's salted hardware key. |\n| `RECEIVER` | Empty or 48-Char Hex | Hardware key of the first activated recipient machine. |\n| `OPEN_AT` | ISO-8601 UTC | ChronoLock unlock timestamp (empty if disabled). |\n| `PASSWORD_HASH` | 64-Char Hex String | Salted SHA-256 password hash (empty if disabled). |\n| `MAX_ATTEMPTS` | Positive Integer | Maximum incorrect password guesses before FileRip trigger. |\n| `CURRENT_ATTEMPTS`| Positive Integer | Number of failed password attempts recorded locally. |\n| `TARGET_USERNAME` | Lowercase Alphanumeric | Recipient username lock (empty if unrestricted). |\n| `RIGGED_EXPIRY` | ISO-8601 UTC | Absolute expiration datetime before automatic melt. |\n| `MAX_OPENS` | Non-negative Integer | Maximum permitted container activations ($0 = \\infty$). |\n| `CURRENT_OPENS` | Non-negative Integer | Total successful activations recorded. |\n| `ALLOW_PRINT` | `1` or `0` | Flag enabling/disabling physical paper printing. |\n| `MEMBERS_ONLY` | `1` or `0` | Enforces mandatory GDRM Firebase authentication. |\n| `TRAIL_START ... TRAIL_END` | Multi-line Block | Local SnailTrail audit entries delimited by `\\|`. |\n| `===PDFDATA===\\n` | Static Delimiter | Binary boundary separating header metadata and encrypted payload. |\n\n---\n\n## 4. Multi-Layer Security & Protection Engines\n\n```\n                                    .gdrm File Opened\n                                           |\n                                           v\n                         +----------------------------------+\n                         | Magic Header: \"GDRM_V1\" Valid?   | ---- No ----> [ FormatException ]\n                         +----------------------------------+\n                                           | Yes\n                                           v\n                         +----------------------------------+\n                         | Has Container Self-Destructed?   | ---- Yes ---> [ Block: \"GDRM_RIPPED\" ]\n                         +----------------------------------+\n                                           | No\n                                           v\n                         +----------------------------------+\n                         | RiggedFile Lifespan Expired?     | ---- Yes ---> [ Trigger Melt & Alert ]\n                         +----------------------------------+\n                                           | No\n                                           v\n                         +----------------------------------+\n                         | RiggedFile Max Opens Exceeded?   | ---- Yes ---> [ Trigger Melt & Alert ]\n                         +----------------------------------+\n                                           | No\n                                           v\n                         +----------------------------------+\n                         | Members-Only Lock Active?        | ---- Not Auth -> [ Prompt Member Login ]\n                         +----------------------------------+\n                                           | Auth OK\n                                           v\n                         +----------------------------------+\n                         | Target Username Lock Active?     | ---- Mismatch -> [ Report Piracy & Block ]\n                         +----------------------------------+\n                                           | Match OK\n                                           v\n                         +----------------------------------+\n                         | Password / FileRip Active?       | ---- Wrong Pass -> [ Increment / Shred ]\n                         +----------------------------------+\n                                           | Pass OK\n                                           v\n                         +----------------------------------+\n                         | ChronoLock Time Active?          | ---- t < openAt -> [ Show Countdown Timer ]\n                         +----------------------------------+\n                                           | t >= openAt\n                                           v\n                         +----------------------------------+\n                         | Machine Hardware Binding Match?  | ---- Mismatch -> [ Alert Piracy & Block ]\n                         +----------------------------------+\n                                           | Match / Bound Now\n                                           v\n                         +----------------------------------+\n                         | IN-MEMORY XOR DECRYPTION & VIEW  |\n                         | - Anti-Screenshot Window Hook    |\n                         | - Dynamic Watermark Overlay      |\n                         | - SnailTrail \"OPEN\" Log Spool    |\n                         +----------------------------------+\n```\n\n### 4.1. Hardware Node-Locking (Autonomous DRM Binding)\n- When packed, `RECEIVER=` is initialized as empty.\n- Upon first execution on an authorized device, the reader retrieves the local hardware key $K_{\\text{local}}$ via `DeviceKeyService.getDeviceKey()`.\n- The container performs atomic string replacement in the binary header: `RECEIVER=\\n` $\\to$ `RECEIVER=<K_local>\\n`.\n- If the file is transferred or copied to any other computer or mobile device, the second device computes $K_{\\text{pirate}} \\neq K_{\\text{local}}$. The reader returns `DrmStatus.piracyDetected`, instantly fires a forensic breach packet to Cloud Firestore, appends a `PIRACY_ALERT` line to the container's internal SnailTrail, and renders `PiracyScreen`.\n\n### 4.2. Recipient Cloud Handle Lock (`TARGET_USERNAME`)\n- Authors can bind files to specific GDRM ecosystem usernames (e.g., `@gauraang`).\n- Upon opening, the reader inspects the active authenticated user's profile.\n- If an unauthenticated guest or mismatched user `@pirate` attempts access, the file is rejected with full IP/MAC forensic tracking.\n\n### 4.3. Members-Only Governance Lock (`MEMBERS_ONLY`)\n- When enabled, access is restricted exclusively to authenticated GDRM Ecosystem community members with verified accounts.\n- Anonymous and guest accounts are rejected, logging an `AUTH_REQUIRED` security event.\n\n### 4.4. FileRip Anti-Brute-Force Self-Destruction\n- Author specifies $M_{\\text{max}} \\in [1, 10]$ attempts.\n- Each failed password entry increments `CURRENT_ATTEMPTS`.\n- If `CURRENT_ATTEMPTS` $\\ge M_{\\text{max}}$, the reader triggers `deployedTerminalSelfDestruct()`:\n  - Overwrites header with `GDRM_RIPPED_V1\\nMETADATA=DESTROYED\\nSTATUS=RIGGED_MELT_TRIGGERED\\n...`\n  - Injects $1024$ bytes of cryptographically secure random noise $\\mathcal{U}(0, 255)$.\n  - Writes the corrupted payload back to disk, permanently destroying the original document.\n\n### 4.5. ChronoLock Temporal Envelope\n- Locks document visibility until an exact future UTC datetime $t_{\\text{openAt}}$.\n- Prevents premature examination paper leakage, timed press embargoes, or pre-release document access.\n- Renders an interactive, real-time ticking countdown timer displaying Days, Hours, Minutes, and Seconds.\n\n### 4.6. RiggedFile Lifespan TimeBomb & View Counter\n- **TimeBomb:** Enforces an absolute validity window (e.g., 30 minutes, 24 hours). A background `Timer.periodic` monitors remaining duration down to 1-second intervals. If the time expires while reading, the view closes immediately, and the file on disk is overwritten with corrupted entropy bytes.\n- **View Ceiling:** Enforces an absolute open count (e.g., 3 opens). Upon opening, the header counter is atomically incremented. Exceeding the threshold triggers container self-destruction.\n\n### 4.7. OS-Level Anti-Screen Capture & Anti-Recording Protection\n- **Windows (x86_64 / Win32):** Integrates native method channel `setSecureWindow` utilizing Windows Display Affinity APIs (`SetWindowDisplayAffinity(hwnd, WDA_MONITOR / WDA_EXCLUDEFROMCAPTURE)`). Screen capture utilities (OBS Studio, Snipping Tool, ShareX, Zoom screen share) capture a blacked-out window.\n- **Android:** Native `MainActivity.kt` enforces `WindowManager.LayoutParams.FLAG_SECURE` across the activity lifecycle, disabling OS screenshots and screen recording.\n- **Windows File Association:** Registers `.gdrm` extension in Windows Registry (`HKCU\\Software\\Classes\\.gdrm` and `GDRMEcosystemFile`) to open seamlessly with the GDRM executable on double-click.\n\n---\n\n## 5. Forensic Dynamic Watermarking & Hardware Printing Engine\n\n```\n+--------------------------------------------------------------------+\n|               DYNAMIC VISUAL & PHYSICAL WATERMARK LAYER            |\n+--------------------------------------------------------------------+\n|                                                                    |\n|  [ TOP MARGIN ]                                                    |\n|  [ GDRM EXAM SECURITY AUDIT - FP: GDRM-A8K2-901F-LL3P ]            |\n|  LICENSED: JANE DOE                                                |\n|                                                                    |\n|                                                                    |\n|      CONFIDENTIAL EVALUATION COPY - DO NOT DUPLICATE               |\n|      LICENSED TO: JANE DOE  |  RECEIVER: @JANEDOE                  |\n|                                                                    |\n|      GDRM SECURE PHYSICAL COPY - EXAM SECURITY SYSTEM              |\n|      AUTHOR: PROF. SMITH  |  PRINT SPOOL: @JANEDOE                 |\n|      FP: GDRM-A8K2-901F-LL3P  |  IP: 192.168.1.45  |  23 Sep 2026  |\n|                                                                    |\n|      FOR OFFICIAL USE ONLY - TRACKED CONTAINER                     |\n|      SIG: SIG_AUTHOR_GDRM  |  MAC: 3C:52:82:A1:04:90               |\n|                                                                    |\n|                                                                    |\n|  [ BOTTOM MARGIN ]                                                 |\n|  PRINTED BY: @JANEDOE  |  23 Sep 2026 10:14  |  IP: 192.168.1.45    |\n|  SIG: SIG_AUTHOR_GDRM                                              |\n|                                                                    |\n+--------------------------------------------------------------------+\n```\n\n### 5.1. Dynamic In-App Screen Watermarking (`DynamicWatermark`)\n- Injected into Flutter's rendering tree via a custom `CustomPainter` layered on top of the PDF viewer widget using `Stack` and `Positioned.fill`.\n- Guaranteed $z$-index dominance with `IgnorePointer` to preserve touch gestures, zooming, and page scrolling.\n- Resolves real-time runtime hardware telemetry:\n  - Client IPv4 address across all active non-loopback network interfaces.\n  - Client MAC address (via `getmac` on Windows, `ip link` / `ifconfig` on Unix).\n  - Operating system platform name and build.\n  - Active session open timestamp (`dd MMM yyyy HH:mm`).\n  - Licensee identity, copyright owner, and meme signature.\n\n### 5.2. Secure Hardware Printing & Virtual Printer Filtering (`PrintingService`)\nStandard PDF printing provides a significant DRM vulnerability through virtual PDF export drivers (e.g., \"Microsoft Print to PDF\", \"Save as PDF\", \"CutePDF\"), which output decrypted documents. GDRM implements a secure physical spooling architecture:\n\n1. **Virtual Printer Blacklist:** Inspects device spooler queues and blocks any printer matching:\n   `pdf`, `xps`, `onenote`, `fax`, `save as`, `print to file`, `cutepdf`, `foxit`, `bullzip`, `primopdf`, `dopdf`, `nitro`, `distiller`, `virtual`.\n2. **True-to-Fit Page Rasterization:** Converts document pages into high-resolution PNG buffers ($200.0\\text{ DPI}$) and computes exact point scaling:\n   $$\\text{Scale} = \\frac{72.0}{\\text{DPI}}$$\n3. **Indelible Watermark Burning:** Synthesizes a new single-spool document containing whisper-faint examination watermarks ($\\approx 1.5\\% - 2.3\\%$ opacity) and perimeter margins.\n4. **Direct Spooling:** Sends bytes directly to physical hardware printers via `Printing.directPrintPdf` without exposing intermediary decrypted PDF files to the operating system's filesystem.\n\n---\n\n## 6. SnailTrail\u2122 Audit System & Piracy Breach Telemetry\n\nGDRM implements a dual-layer audit trail:\n1. **Local Container Audit Chain:** Serialized directly inside the `.gdrm` file header.\n2. **Cloud Database SnailTrail:** Live-synced to Google Cloud Firestore with real-time reactive streams.\n\n```\n+---------------------------------------------------------------------------------------------+\n|                                    SNAILTRAIL EVENT LIFECYCLE                               |\n+---------------------------------------------------------------------------------------------+\n|                                                                                             |\n|   [ PACK ]           Container authored and encrypted with sender token & hardware key.     |\n|      |                                                                                      |\n|      v                                                                                      |\n|   [ OPEN ]           Verified authorized opening; records active user, IP, MAC & timestamp. |\n|      |                                                                                      |\n|      v                                                                                      |\n|   [ PRINT ]          Document watermarked and spooled to physical printer hardware.         |\n|      |                                                                                      |\n|      v                                                                                      |\n|   [ CLOSED ]         Session finalized; records active duration in seconds and exit page.   |\n|      |                                                                                      |\n|      v                                                                                      |\n|   [ PIRACY_ALERT ]   Unauthorized device or recipient detected; broadcasts telemetry.      |\n|      |                                                                                      |\n|      v                                                                                      |\n|   [ FILERIP ]        Brute-force limit exceeded; permanent shredding recorded.              |\n|                                                                                             |\n+---------------------------------------------------------------------------------------------+\n```\n\n### 6.1. SnailTrail Event Serialization Format\n```\n<ACTION>|<TIMESTAMP>|<DEVICE_KEY>|<DETAILS>\n```\nExample Log Entry:\n```\nPACKED|1727065420.104|8f3a9e041d8c72b5a190ef12bc44391a876402ec98b0f1aa|Encrypted container authored by @gauraang\nOPEN|1727065512.430|8f3a9e041d8c72b5a190ef12bc44391a876402ec98b0f1aa|Session active by @janedoe (IP: 192.168.1.15, MAC: 3C:52:82:A1:04:90)\nPHYSICAL_PRINT|1727065600.812|8f3a9e041d8c72b5a190ef12bc44391a876402ec98b0f1aa|Document watermarked and spooled to printer \"HP LaserJet Pro MFP\" by @janedoe\nCLOSED|1727065740.990|8f3a9e041d8c72b5a190ef12bc44391a876402ec98b0f1aa|Session closed. Duration: 228s, ExitPage: 4 (IP: 192.168.1.15)\n```\n\n### 6.2. Cloud Firestore Schema\n\n#### Collection: `gdrm_users/{username}`\n```json\n{\n  \"name\": \"Jane Doe\",\n  \"username\": \"janedoe\",\n  \"email\": \"janedoe@example.com\",\n  \"uid\": \"firebase_auth_uid_string\",\n  \"isEmailVerified\": true,\n  \"emailVerifiedAt\": \"Timestamp\",\n  \"createdAt\": \"Timestamp\"\n}\n```\n\n#### Collection: `gdrm_piracy_alerts/{alertId}`\n```json\n{\n  \"fingerprint\": \"GDRM-K92X-P10A-88LZ\",\n  \"fileName\": \"Confidential_Exam.gdrm\",\n  \"licensedTo\": \"Jane Doe\",\n  \"copyrightOwner\": \"University Examination Board\",\n  \"senderUsername\": \"examiner_admin\",\n  \"senderEmail\": \"examiner@university.edu\",\n  \"pirateDeviceKey\": \"4c891f0923ba8e...\",\n  \"pirateIp\": \"198.51.100.42\",\n  \"pirateMac\": \"00:1A:2B:3C:4D:5E\",\n  \"pirateUsername\": \"unauthorized_user\",\n  \"piratePlatform\": \"windows\",\n  \"action\": \"PIRACY_DETECTED\",\n  \"details\": \"Hardware Piracy Breach: Device mismatch detected.\",\n  \"timestamp\": \"ServerTimestamp\",\n  \"isRead\": false\n}\n```\n\n#### Collection: `gdrm_snail_trails/{fingerprint}/events/{eventId}`\n```json\n{\n  \"fingerprint\": \"GDRM-K92X-P10A-88LZ\",\n  \"action\": \"OPEN\",\n  \"deviceKey\": \"8f3a9e041d8c...\",\n  \"details\": \"Session active by @janedoe (IP: 192.168.1.15)\",\n  \"senderUsername\": \"examiner_admin\",\n  \"activeUsername\": \"janedoe\",\n  \"ipAddress\": \"192.168.1.15\",\n  \"macAddress\": \"3C:52:82:A1:04:90\",\n  \"platform\": \"windows\",\n  \"timestamp\": \"ServerTimestamp\"\n}\n```\n\n---\n\n## 7. Cloud Identity, Authentication & SMTP OTP Verification\n\n```\n+-------------------------------------------------------------------------------------------------+\n|                                 USER AUTHENTICATION & OTP WORKFLOW                              |\n+-------------------------------------------------------------------------------------------------+\n|                                                                                                 |\n|   1. Registration Form Entered (Name, Username, Email, Password)                                |\n|        |                                                                                        |\n|        v                                                                                        |\n|   2. System Generates 6-Digit Cryptographic OTP: R in [100000, 999999]                          |\n|        |                                                                                        |\n|        v                                                                                        |\n|   3. Gmail SMTP Transport Spools HTML Template to Recipient Email                               |\n|        |                                                                                        |\n|        v                                                                                        |\n|   4. User Enters 6-Digit OTP in Client Dialog (10-Minute Validity Window)                       |\n|        |                                                                                        |\n|        +---- Invalid / Expired ----> [ Rejection & Request New OTP ]                            |\n|        |                                                                                        |\n|        v Valid Match                                                                            |\n|   5. Firebase Auth Identity Created (createUserWithEmailAndPassword)                            |\n|        |                                                                                        |\n|        v                                                                                        |\n|   6. Firestore Document Created: gdrm_users/{cleanUsername}                                     |\n|        |                                                                                        |\n|        v                                                                                        |\n|   7. Real-Time Security Alert Stream Initialized (PiracyService.getPiracyAlertsStream)          |\n|                                                                                                 |\n+-------------------------------------------------------------------------------------------------+\n```\n\n### 7.1. Transactional SMTP Email Integration (`SmtpEmailService`)\n- Connects directly to Google SMTP servers via authenticated TLS transport on port 465 / 587.\n- Sends styled HTML security emails for:\n  - **New Account Registration OTP**\n  - **Email Address Verification OTP**\n  - **Permanent Account Deletion Authorization OTP**\n  - **Password Reset Recovery**\n\n---\n\n## 8. Codebase Directory Structure & Component Map\n\n```\nd:/Kabada/GDRM Flutter/gdrm_ecosystem/\n\u251c\u2500\u2500 android/                             # Android native host project\n\u2502   \u2514\u2500\u2500 app/src/main/kotlin/             # Native Kotlin MainActivity (FLAG_SECURE)\n\u251c\u2500\u2500 firestore.rules                      # Cloud Firestore security rules\n\u251c\u2500\u2500 lib/\n\u2502   \u251c\u2500\u2500 firebase_options.dart            # Firebase platform initialization options\n\u2502   \u251c\u2500\u2500 main.dart                        # Application bootstrap & dependency injection\n\u2502   \u251c\u2500\u2500 models/\n\u2502   \u2502   \u2514\u2500\u2500 gdrm_model.dart              # Core data models, parsing & cryptographic transforms\n\u2502   \u251c\u2500\u2500 screens/\n\u2502   \u2502   \u251c\u2500\u2500 chrono_lock_screen.dart      # Real-time ChronoLock countdown timer interface\n\u2502   \u2502   \u251c\u2500\u2500 cloud_auth_screen.dart       # Legacy authentication screen\n\u2502   \u2502   \u251c\u2500\u2500 global_auth_screen.dart      # Cloud login, registration & SMTP OTP dialogs\n\u2502   \u2502   \u251c\u2500\u2500 home_screen.dart             # Responsive dual-pane / drawer layout scaffold\n\u2502   \u2502   \u251c\u2500\u2500 packer_console.dart          # Authoring & packaging control console\n\u2502   \u2502   \u251c\u2500\u2500 piracy_alerts_screen.dart    # Real-time author security breach monitoring hub\n\u2502   \u2502   \u251c\u2500\u2500 piracy_screen.dart           # Pulsing red lock screen shown on unauthorized access\n\u2502   \u2502   \u251c\u2500\u2500 reader_console.dart          # Decryption, viewing & security evaluation engine\n\u2502   \u2502   \u2514\u2500\u2500 snail_trail_screen.dart      # Audit trail visualization (Local vs Cloud stream)\n\u2502   \u251c\u2500\u2500 services/\n\u2502   \u2502   \u251c\u2500\u2500 content_uri_service.dart     # Android content:// URI stream resolver\n\u2502   \u2502   \u251c\u2500\u2500 device_key_service.dart      # Hardware UUID generation & persistent caching\n\u2502   \u2502   \u251c\u2500\u2500 file_intent_service.dart     # Deep links, file drops & CLI argument stream\n\u2502   \u2502   \u251c\u2500\u2500 piracy_service.dart          # Firestore audit logger & breach notification service\n\u2502   \u2502   \u251c\u2500\u2500 printing_service.dart        # Virtual printer filter & watermarked physical spooler\n\u2502   \u2502   \u251c\u2500\u2500 security_service.dart        # Win32 screen protection & registry file association\n\u2502   \u2502   \u2514\u2500\u2500 smtp_email_service.dart      # Gmail SMTP transport for transactional OTPs\n\u2502   \u251c\u2500\u2500 state/\n\u2502   \u2502   \u2514\u2500\u2500 app_state.dart               # ChangeNotifier central application state container\n\u2502   \u251c\u2500\u2500 theme/\n\u2502   \u2502   \u2514\u2500\u2500 app_theme.dart               # Cyan/Amber dark cyberpunk design tokens\n\u2502   \u2514\u2500\u2500 widgets/\n\u2502       \u251c\u2500\u2500 account_profile_dialog.dart  # Modal user profile, credentials & account deletion\n\u2502       \u251c\u2500\u2500 dynamic_watermark.dart       # Tiled affine rotation canvas watermark painter\n\u2502       \u251c\u2500\u2500 shared_widgets.dart          # Common UI components, nav buttons & auth badges\n\u2502       \u2514\u2500\u2500 sidebar.dart                 # Desktop navigation sidebar & active manifest drawer\n\u251c\u2500\u2500 pubspec.yaml                         # Project dependencies & asset configuration\n\u2514\u2500\u2500 README.md                            # Quickstart documentation\n```\n\n---\n\n## 9. Security Threat Analysis & Mitigation Matrix\n\n| Attack Vector | Threat Scenario | GDRM Mitigation Mechanism |\n|---|---|---|\n| **File Sharing / Piracy** | User sends `.gdrm` file to a friend or unauthorized device. | **Hardware Node-Locking:** Receiver hash $R$ mismatch triggers `DrmStatus.piracyDetected`, locks display, and alerts author via Firestore. |\n| **Virtual PDF Re-export** | User attempts to \"Print to PDF\" to strip DRM encryption. | **Virtual Printer Filter:** `PrintingService` scans spooler queues and blocks virtual PDF/XPS writers; only physical printers are permitted. |\n| **Screen Scraping / Recording** | Attacker records screen with OBS, Snipping Tool, or Zoom. | **OS Anti-Capture Hook:** Windows `SetWindowDisplayAffinity` and Android `FLAG_SECURE` black out application window buffers. |\n| **Camera / External Capture** | Attacker takes a physical photograph of the monitor screen. | **Dynamic Forensic Watermark:** Displays viewer's IP, MAC address, timestamp, licensee name, and signature across the entire document. |\n| **Physical Document Leakage** | Printed paper copies are leaked outside authorized rooms. | **Perimeter & Diagonal Exam Watermark:** Indelible low-opacity author, printer spool user, IP, MAC, and fingerprint burned into physical paper. |\n| **Brute-Force Password Cracking** | Attacker uses dictionary attacks against password-protected file. | **FileRip Self-Destruction:** Container records failed attempts; reaching $M_{\\text{max}}$ shreds the file on disk into $1024$ random bytes. |\n| **Premature Leakage** | Exam papers or embargoed files opened before scheduled date. | **ChronoLock Engine:** Time-locked until $t_{\\text{openAt}}$; evaluates UTC time and displays live countdown timer. |\n| **Container Tampering** | Attacker edits header strings or attempts XOR payload extraction. | **Format & Hash Validation:** Tampering corrupts marker boundaries or keystream derivation, causing decryption failure. |\n\n---\n\n## 10. Summary & Verification\n\nThe GDRM Ecosystem combines cryptographic rigor with client-side operating system protections and cloud-synchronized audit capabilities. All formulas, structural packet offsets, keystream derivation hash chains, state machines, and threat mitigations are implemented natively within Dart/Flutter and verified for cross-platform deployment.\n";
