<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#377e22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Outer Shield Armor -->
  <path d="M32 10 L48 16 C48 30 42 43 32 50 C22 43 16 30 16 16 Z" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner High-Security Lock & Core -->
  <rect x="25" y="27" width="14" height="11" rx="2.5" fill="url(#primaryGrad)"/>
  <path d="M28 27 V23 C28 20.8 29.8 19 32 19 C34.2 19 36 20.8 36 23 V27" 
        fill="none" 
        stroke="#4ade80" 
        stroke-width="2.2" 
        stroke-linecap="round"/>
  
  <!-- Micro Keyhole -->
  <circle cx="32" cy="31.5" r="1.5" fill="#080c14"/>
  <path d="M32 32.5 V35" stroke="#080c14" stroke-width="1.5" stroke-linecap="round"/>
</svg>
